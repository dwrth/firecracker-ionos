storage:
 base_rootfs: /var/lib/knaller/images/base-rootfs.ext4
 kernel: /var/lib/knaller/images/vmlinux-6.18.44

scheduler:
 host_memory_reserve_mib: 768
 cpu_overcommit_ratio: 2.0
 minimum_sandbox_memory_mib: 128
 maximum_sandbox_memory_mib: 8192
 maximum_sandbox_vcpus: 32

network:
 guest_cidr: 172.16.0.0/16
 transit_cidr: 10.200.0.0/16

jailer:
 base_dir: /srv/jailer
 uid_start: 12000
 gid_start: 12000

state:
 directory: /var/lib/knaller/state

firecracker:
 sandbox_directory: /var/lib/knaller/vms
